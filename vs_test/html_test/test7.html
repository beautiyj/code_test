<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>게시판 폼</title>
  </head>

  <body>
    <form method="post" action="board.jsp">
      <table border="1" width="600" align="center">
        <caption>
          게시판
        </caption>
        <tr>
          <th><label for="writer">작성자</label></th>
          <td>
            <input
              type="text"
              id="writer"
              name="writer"
              size="10"
              class="hint-gray"
              placeholder="작성자명 입력"
              required
              autofocus />
          </td>
        </tr>

        <tr>
          <th><label for="password">비밀번호</label></th>
          <td>
            <input
              type="password"
              id="password"
              name="password"
              size="10"
              class="hint-gray"
              placeholder="비밀번호"
              required />
          </td>
        </tr>

        <tr>
          <th><label for="title">제목</label></th>
          <td>
            <input
              type="text"
              id="title"
              name="title"
              size="20"
              class="hint-gray"
              placeholder="20자 이내로 입력"
              required />
          </td>
        </tr>

        <tr>
          <th><label for="content">내용</label></th>
          <td>
            <textarea
              id="content"
              name="content"
              cols="50"
              rows="10"
              class="hint-gray"
              placeholder="내용 입력(textarea의 placeholder는 컬러나 스타일이 다름)"
              required></textarea>
          </td>
        </tr>
        <tr>
          <th>파일첨부</th>
          <td><input type="file" id="myfile" name="myfile" /></td>
        </tr>

        <tr>
          <td colspan="2" align="center">
            <input type="submit" value="글작성" />
            <input type="button" value="글작성 버튼형식" />
            <input type="reset" value="취소" />
          </td>
        </tr>
      </table>
    </form>
  </body>
</html>
